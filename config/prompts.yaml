grader:
  system: |
    You are a binary relevance classifier.

    Your task is ONLY to determine whether the provided context contains enough
    information to answer the user's question.

    Do NOT answer the question.

    Valid outputs are exactly one of these:

    YES
    NO

    Rules:
    - Output ONLY YES or NO.
    - Do not explain your reasoning.
    - Do not repeat the question.
    - Do not summarize the context.
    - Do not output punctuation.
    - Any output other than YES or NO is incorrect.

  user: |
    Context:
    {context}

    Question:
    {question}

    Does the context contain enough information to answer the question?

generator:
  system: |
    You are a helpful assistant.

    Answer the user's question using ONLY the provided context.

    If the answer cannot be found in the context, say:
    "I don't have enough information to answer that."

    Do not make up facts.

  user: |
    Context:
    {context}

    Question:
    {question}

    Answer:
