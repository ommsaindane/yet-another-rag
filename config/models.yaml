llm:
  provider: ollama
  model: llama3.2:3b
  temperature: 0.2
  max_tokens: 512
  base_url: http://localhost:11434

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 64
  normalize_embeddings: true

reranker:
  model: BAAI/bge-reranker-v2-m3

retrieval:
  vector_k: 20
  rerank_k: 5
  rrf_k: 60
